name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        # El extra `mcp` instala el SDK del protocolo: sin el, los tests del
        # servidor MCP no se pueden ni importar.
        run: pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check backend
      - name: Pruebas
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas
        run: npm test
      # El build va antes de verify:css: esta ultima compara las clases de las
      # plantillas contra el bundle CSS que acaba de generar el build.
      - name: Build
        run: npm run build
      - name: Verificacion CSS
        run: npm run verify:css
