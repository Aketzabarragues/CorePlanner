<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CorePlanner — demo de la integración</title>
    <meta
      name="description"
      content="Demo visual de CorePlanner con lo aprendido del análisis de OpenProject y otros repositorios: planificador de recursos, veredictos discretos de capacidad, políticas con aprobación, horarios versionados, dependencias y agente MCP."
    />
    <style>
/* ==========================================================================
   CorePlanner — demo visual de la integracion
   Sistema de estilos. Sin dependencias: mismo lenguaje visual que la app
   actual (sidebar slate-900, acento Siemens rgb(0 52 102), superficie slate-50).
   ========================================================================== */

:root {
  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;

  --siemens-50: #eef4fa;
  --siemens-100: #dbe8f5;
  --siemens-500: #0064b4;
  --siemens-700: #004a89;
  --siemens-900: #003466;

  --red-50: #fef2f2;
  --red-200: #fecaca;
  --red-500: #ef4444;
  --red-600: #dc2626;
  --red-700: #b91c1c;

  --amber-50: #fffbeb;
  --amber-200: #fde68a;
  --amber-500: #f59e0b;
  --amber-700: #b45309;

  --emerald-50: #ecfdf5;
  --emerald-200: #a7f3d0;
  --emerald-600: #059669;
  --emerald-700: #047857;

  --violet-50: #f5f3ff;
  --violet-200: #ddd6fe;
  --violet-600: #7c3aed;
  --violet-700: #6d28d9;

  --radius: 6px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--slate-50);
  color: var(--slate-900);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
    'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  cursor: pointer;
}

table {
  border-collapse: collapse;
}

:focus-visible {
  outline: 2px solid var(--siemens-500);
  outline-offset: 2px;
}

/* ---------------------------------------------------------------- armazon */

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  display: flex;
  flex-shrink: 0;
  flex-direction: column;
  background: var(--slate-900);
  color: var(--slate-300);
  width: 256px;
  transition: width 0.18s ease;
}

.sidebar.is-collapsed {
  width: 64px;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 12px;
}

.brand-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: var(--radius);
  background: var(--siemens-500);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.brand-text {
  min-width: 0;
  flex: 1;
}

.brand-text strong {
  display: block;
  overflow: hidden;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-text span {
  display: block;
  color: var(--slate-400);
  font-size: 11px;
  line-height: 1.2;
}

.ico {
  display: inline-flex;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  vertical-align: middle;
}

.icon-btn {
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--slate-400);
  padding: 4px;
  line-height: 0;
}

.icon-btn:hover {
  background: var(--slate-800);
  color: #fff;
}

.sidebar-context {
  border-bottom: 1px solid var(--slate-800);
  padding: 0 12px 12px;
}

.sidebar-context p {
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-context .kicker {
  color: var(--slate-500);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.sidebar-context .name {
  color: #fff;
  font-size: 14px;
}

.sidebar-context .sub {
  color: var(--slate-400);
  font-size: 12px;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.nav-group + .nav-group {
  margin-top: 12px;
}

.nav-group-title {
  margin: 12px 12px 4px;
  color: var(--slate-500);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: 0;
  border-left: 4px solid transparent;
  border-radius: 0 var(--radius) var(--radius) 0;
  background: transparent;
  color: var(--slate-400);
  padding: 8px 12px;
  font-size: 14px;
  text-align: left;
  transition: background 0.12s ease, color 0.12s ease;
}

.nav-item:hover {
  background: var(--slate-800);
  color: #fff;
}

.nav-item.is-active {
  border-left-color: var(--siemens-500);
  background: var(--slate-800);
  color: #fff;
  font-weight: 500;
}

.nav-item .ico {
  display: inline-flex;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.nav-item .label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar.is-collapsed .nav-item {
  justify-content: center;
  padding: 8px 0;
}

.sidebar.is-collapsed .nav-group-title,
.sidebar.is-collapsed .label,
.sidebar.is-collapsed .sidebar-context p,
.sidebar.is-collapsed .brand-text {
  display: none;
}

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--slate-800);
  padding: 12px;
}

.sidebar-user .who {
  min-width: 0;
  flex: 1;
}

.sidebar-user .who strong {
  display: block;
  overflow: hidden;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-user .who span {
  display: block;
  overflow: hidden;
  color: var(--slate-400);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 999px;
  background: var(--siemens-500);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
}

.avatar.tone-alt {
  background: var(--slate-700);
}

.avatar.tone-warn {
  background: var(--amber-500);
}

.avatar.tone-danger {
  background: var(--red-600);
}

.avatar.sm {
  width: 26px;
  height: 26px;
  font-size: 11px;
}

.avatar.lg {
  width: 44px;
  height: 44px;
  font-size: 15px;
}

/* ---------------------------------------------------------------- cabecera */

.main {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
}

.topbar {
  display: flex;
  height: 56px;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--slate-200);
  background: #fff;
  padding: 0 24px;
}

.crumbs {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.crumbs span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.crumbs .muted {
  color: var(--slate-500);
}

.crumbs .current {
  color: var(--slate-900);
  font-weight: 500;
}

.crumbs .sep {
  color: var(--slate-300);
}

.topbar-actions {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 12px;
}

.content {
  flex: 1;
  overflow: auto;
  padding: 24px;
}

/* ----------------------------------------------------------------- pieces */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}

.btn .ico {
  display: inline-flex;
  width: 16px;
  height: 16px;
}

.btn-primary {
  background: var(--siemens-900);
  color: #fff;
}

.btn-primary:hover {
  background: var(--siemens-700);
}

.btn-secondary {
  border-color: var(--slate-300);
  background: #fff;
  color: var(--slate-700);
}

.btn-secondary:hover {
  background: var(--slate-50);
  color: var(--slate-900);
}

.btn-ghost {
  background: transparent;
  color: var(--slate-600);
}

.btn-ghost:hover {
  background: var(--slate-100);
  color: var(--slate-900);
}

.btn-success {
  background: var(--emerald-600);
  color: #fff;
}

.btn-success:hover {
  background: var(--emerald-700);
}

.btn-danger {
  border-color: var(--red-200);
  background: #fff;
  color: var(--red-700);
}

.btn-danger:hover {
  background: var(--red-50);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 13px;
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.badge .dot {
  width: 6px;
  height: 6px;
  flex-shrink: 0;
  border-radius: 999px;
  background: currentColor;
}

.badge-critical {
  background: var(--red-50);
  border-color: var(--red-200);
  color: var(--red-700);
}

.badge-tight {
  background: var(--amber-50);
  border-color: var(--amber-200);
  color: var(--amber-700);
}

.badge-balanced {
  background: var(--siemens-50);
  border-color: var(--siemens-100);
  color: var(--siemens-700);
}

.badge-buffer {
  background: var(--slate-100);
  border-color: var(--slate-200);
  color: var(--slate-600);
}

.badge-no_capacity {
  background: var(--violet-50);
  border-color: var(--violet-200);
  color: var(--violet-700);
}

.badge-no_work {
  border-color: var(--slate-200);
  border-style: dashed;
  background: var(--slate-50);
  color: var(--slate-400);
}

.badge-active {
  background: var(--emerald-50);
  border-color: var(--emerald-200);
  color: var(--emerald-700);
}

.badge-paused {
  background: var(--amber-50);
  border-color: var(--amber-200);
  color: var(--amber-700);
}

.badge-neutral {
  background: var(--slate-100);
  border-color: var(--slate-200);
  color: var(--slate-600);
}

.badge-source {
  border-color: var(--slate-200);
  background: var(--slate-50);
  color: var(--slate-500);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.02em;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 4px;
  background: var(--slate-100);
  padding: 2px 8px;
  color: var(--slate-600);
  font-size: 12px;
  white-space: nowrap;
}

.tag.siemens {
  background: var(--siemens-50);
  color: var(--siemens-700);
}

.table .tag {
  display: inline-block;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: middle;
}

.card {
  border: 1px solid var(--slate-200);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow-sm);
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--slate-200);
  padding: 12px 16px;
}

.card-head h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}

.card-head .sub {
  color: var(--slate-500);
  font-size: 12px;
}

.card-body {
  padding: 16px;
}

.card-body.tight {
  padding: 0;
}

.grid {
  display: grid;
  gap: 16px;
}

.grid-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-2-1 {
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
}

.grid-1-2 {
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.row.wrap {
  flex-wrap: wrap;
}

.row.between {
  justify-content: space-between;
}

.spacer {
  flex: 1;
}

/* ------------------------------------------------------------ indicadores */

.stat {
  border: 1px solid var(--slate-200);
  border-radius: 8px;
  background: #fff;
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--slate-500);
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stat-value {
  margin-top: 6px;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.stat-value small {
  color: var(--slate-400);
  font-size: 15px;
  font-weight: 500;
}

.stat-foot {
  margin-top: 6px;
  color: var(--slate-500);
  font-size: 12px;
}

.stat-foot.up {
  color: var(--red-600);
}

.stat-foot.good {
  color: var(--emerald-600);
}

/* --------------------------------------------------------------- toolbar */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.toolbar .spacer {
  flex: 1;
}

.field {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--slate-300);
  border-radius: var(--radius);
  background: #fff;
  padding: 7px 10px;
  color: var(--slate-700);
  font-size: 13px;
}

.field select,
.field input {
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  outline: none;
}

.seg {
  display: inline-flex;
  overflow: hidden;
  border: 1px solid var(--slate-300);
  border-radius: var(--radius);
  background: #fff;
}

.seg button {
  border: 0;
  border-right: 1px solid var(--slate-200);
  background: transparent;
  color: var(--slate-600);
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 500;
}

.seg button:last-child {
  border-right: 0;
}

.seg button:hover {
  background: var(--slate-50);
}

.seg button.is-active {
  background: var(--siemens-900);
  color: #fff;
}

/* ---------------------------------------------------------------- tabla */

.table {
  width: 100%;
  font-size: 14px;
}

.table th {
  border-bottom: 1px solid var(--slate-200);
  background: var(--slate-50);
  color: var(--slate-500);
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

.table td {
  border-bottom: 1px solid var(--slate-100);
  padding: 10px 12px;
  vertical-align: middle;
}

.table tbody tr:last-child td {
  border-bottom: 0;
}

.table tbody tr:hover {
  background: var(--slate-50);
}

.table .num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.table .tight-col {
  width: 1%;
  white-space: nowrap;
}

/* --------------------------------------------------------------- matriz */

.matrix-wrap {
  overflow: auto;
  border: 1px solid var(--slate-200);
  border-radius: 8px;
  background: #fff;
}

.matrix {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

.matrix th,
.matrix td {
  border-right: 1px solid var(--slate-100);
  border-bottom: 1px solid var(--slate-100);
}

.matrix thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  border-bottom: 1px solid var(--slate-200);
  background: var(--slate-50);
  padding: 6px 8px;
  text-align: center;
  white-space: nowrap;
}

.matrix thead th .wk {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--slate-700);
  letter-spacing: 0.02em;
}

.matrix thead th .wk-sub {
  display: block;
  color: var(--slate-400);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
}

.matrix thead th.now {
  background: var(--siemens-50);
}

.matrix thead th.now .wk {
  color: var(--siemens-700);
}

.matrix .corner {
  position: sticky;
  left: 0;
  z-index: 4;
  min-width: 232px;
  background: var(--slate-50);
  text-align: left;
}

.matrix tbody th.corner {
  z-index: 2;
  background: #fff;
}

.matrix tbody tr:hover th.corner {
  background: var(--slate-50);
}

.person-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}

.person-cell .meta {
  min-width: 0;
}

.person-cell strong {
  display: block;
  overflow: hidden;
  font-size: 13px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.person-cell span {
  display: block;
  overflow: hidden;
  color: var(--slate-500);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cell {
  position: relative;
  min-width: 74px;
  padding: 6px 8px;
  text-align: center;
  cursor: pointer;
  transition: box-shadow 0.12s ease;
}

.cell:hover {
  box-shadow: inset 0 0 0 2px var(--siemens-500);
}

.cell .h {
  display: block;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.cell .p {
  display: block;
  font-size: 10px;
  font-weight: 500;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

.cell.v-critical {
  background: var(--red-50);
  color: var(--red-700);
}

.cell.v-tight {
  background: var(--amber-50);
  color: var(--amber-700);
}

.cell.v-balanced {
  background: var(--siemens-50);
  color: var(--siemens-700);
}

.cell.v-buffer {
  background: #fff;
  color: var(--slate-600);
}

.cell.v-no_capacity {
  background: var(--violet-50);
  color: var(--violet-700);
}

.cell.v-no_work {
  background: repeating-linear-gradient(
    45deg,
    var(--slate-50),
    var(--slate-50) 4px,
    #fff 4px,
    #fff 8px
  );
  color: var(--slate-400);
}

.cell.drift-up {
  box-shadow: inset 0 -3px 0 var(--red-500);
}

.cell.drift-down {
  box-shadow: inset 0 -3px 0 var(--emerald-600);
}

.matrix tfoot td,
.matrix tfoot th {
  position: sticky;
  bottom: 0;
  z-index: 3;
  border-top: 1px solid var(--slate-200);
  background: var(--slate-50);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.matrix tfoot th.corner {
  z-index: 4;
  background: var(--slate-50);
  text-align: left;
}

.matrix tfoot td .h,
.matrix tfoot td .p {
  display: block;
}

.matrix tfoot td .h {
  font-size: 13px;
  font-weight: 600;
}

.matrix tfoot td .p {
  font-size: 10px;
  font-weight: 500;
  color: var(--slate-500);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  color: var(--slate-500);
  font-size: 12px;
}

/* --------------------------------------------------------- barra veredicto */

.verdict-bar {
  display: flex;
  overflow: hidden;
  height: 8px;
  border-radius: 999px;
  background: var(--slate-100);
}

/* ==========================================================================
   CorePlanner — demo visual: motor de capacidad (puro)
   Reproduce la logica real: reparto de horas entre dias laborables del
   calendario, imputacion por semana ISO y veredicto discreto.
   ========================================================================== */

var CoreEngine = (function () {
  'use strict'

  function pad(n) {
    return n < 10 ? '0' + n : '' + n
  }

  function dnum(s) {
    var p = s.split('-')
    return Date.UTC(+p[0], +p[1] - 1, +p[2])
  }

  function dstr(ms) {
    var d = new Date(ms)
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())
  }

  function addDays(s, n) {
    return dstr(dnum(s) + n * 86400000)
  }

  function dayOfWeek(s) {
    return new Date(dnum(s)).getUTCDay()
  }

  /** Clave de semana ISO: "2026-W46". */
  function isoWeekKey(s) {
    var d = new Date(dnum(s))
    var dow = (d.getUTCDay() + 6) % 7
    d.setUTCDate(d.getUTCDate() - dow + 3)
    var isoYear = d.getUTCFullYear()
    var firstThursday = new Date(Date.UTC(isoYear, 0, 4))
    var fdow = (firstThursday.getUTCDay() + 6) % 7
    firstThursday.setUTCDate(firstThursday.getUTCDate() - fdow + 3)
    var week = 1 + Math.round((d.getTime() - firstThursday.getTime()) / (7 * 86400000))
    return isoYear + '-W' + pad(week)
  }

  /** Lunes de la semana ISO indicada. */
  function weekMonday(weekKey) {
    var parts = weekKey.split('-W')
    var year = +parts[0]
    var week = +parts[1]
    var jan4 = Date.UTC(year, 0, 4)
    var dow = (new Date(jan4).getUTCDay() + 6) % 7
    return dstr(jan4 - dow * 86400000 + (week - 1) * 7 * 86400000)
  }

  /**
   * Peso de festivo de un dia para un contexto dado.
   * Devuelve 0, 0.5 (medio dia) o 1 (jornada completa perdida).
   */
  function holidayWeight(date, ctx) {
    var holidays = DEMO.HOLIDAYS
    for (var i = 0; i < holidays.length; i++) {
      var h = holidays[i]
      if (h.date !== date) continue
      var applies = false
      if (h.scope === 'global') applies = true
      else if (h.scope === 'dept') applies = h.scope_label === ctx.dept
      else if (h.scope === 'person') applies = h.scope_label === ctx.personName
      if (!applies) continue
      return h.half_day ? 0.5 : 1
    }
    return 0

  function workingDays(start, end, ctx) {

    var weight = 0
    var i
    for (i = 0; i < days.length; i++) weight += days[i].weight
    if (!weight) return []
    var parts = []
    for (i = 0; i < days.length; i++) {
      parts.push({
        date: days[i].date,
        week: isoWeekKey(days[i].date),
        hours: (task.hours * days[i].weight) / weight,
      })
    }
    return parts
  }

  /**
   * Matriz de capacidad de un conjunto de proyectos.
   * Devuelve filas por persona con las horas planificadas por semana.
   */
  function capacityFor(projectIds) {
    var rows = {}
    DEMO.TASKS.forEach(function (task) {
      if (projectIds.indexOf(task.project) < 0) return
      if (!task.user) return
      var person = personById(task.user)
      if (!person) return
      var parts = distribute(task, person)
      var row = rows[task.user]
      if (!row) {
        row = rows[task.user] = { user_id: task.user, plan: {} }
      }
      parts.forEach(function (part) {
        row.plan[part.week] = (row.plan[part.week] || 0) + part.hours
      })
    })
    return rows
  }

  /** Capacidad de una persona en una semana, como fraccion de su base. */
  function capacityOf(person, weekKey) {
    return weeklyCapacity(person, weekKey)
  }

  /**
   * Veredicto discreto de capacidad (Leantime): la celda roja pasa a ser
   * un estado ordenado por gravedad.
   */
  function verdictFor(hours, capacity) {
    if (capacity <= 0) return 'no_capacity'
    if (!hours) return 'no_work'
    var ratio = (hours / capacity) * 100
    if (ratio >= DEMO.THRESHOLDS.hard) return 'critical'
    if (ratio >= DEMO.THRESHOLDS.warn) return 'tight'
    if (ratio >= 50) return 'balanced'
    return 'buffer'
  }

  function ratioOf(hours, capacity) {
    if (!capacity) return null
    return Math.round((hours / capacity) * 1000) / 10
  }

  function personById(id) {
    var people = DEMO.PEOPLE
    for (var i = 0; i < people.length; i++) {
      if (people[i].id === id) return people[i]
    }
    return null
  }

  function projectById(id) {
    var projects = DEMO.PROJECTS
    for (var i = 0; i < projects.length; i++) {
      if (projects[i].id === id) return projects[i]
    }
    return null
  }

  function taskById(id) {
    var tasks = DEMO.TASKS
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) return tasks[i]
    }
    return null
  }

  /** Tareas de un proyecto. */
  function tasksOf(projectId) {
    return DEMO.TASKS.filter(function (task) {
      return task.project === projectId
    })
  }

  /** Personas de un proyecto: miembros mas quienes tienen tareas asignadas. */
  function peopleOf(projectId) {
    var project = projectById(projectId)
    var ids = project ? project.members.slice() : []
    tasksOf(projectId).forEach(function (task) {
      if (task.user && ids.indexOf(task.user) < 0) ids.push(task.user)
    })
    return ids.map(personById).filter(Boolean)
  }

  /** Dependencias que affectan a un conjunto de tareas. */
  function dependenciesOf(projectId) {
    var ids = tasksOf(projectId).map(function (task) {
      return task.id
    })
    return DEMO.DEPENDENCIES.filter(function (dep) {
      return ids.indexOf(dep.from) >= 0 && ids.indexOf(dep.to) >= 0
    })
  }

  function fmtHours(value) {
    if (value === null || value === undefined) return '—'
    var rounded = Math.round(value * 100) / 100
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace(/0$/, '')
  }

  return {
    pad: pad,
    dnum: dnum,
    dstr: dstr,
    addDays: addDays,
    dayOfWeek: dayOfWeek,
    isoWeekKey: isoWeekKey,
    weekMonday: weekMonday,
    holidayWeight: holidayWeight,
    workingDays: workingDays,
    weeklyCapacity: weeklyCapacity,
    distribute: distribute,
    capacityFor: capacityFor,
    capacityOf: capacityOf,
    verdictFor: verdictFor,
    ratioOf: ratioOf,
    personById: personById,
    projectById: projectById,
    taskById: taskById,
    tasksOf: tasksOf,
    peopleOf: peopleOf,
    dependenciesOf: dependenciesOf,
    fmtHours: fmtHours,
  }
})()

  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(
      /[&<>"']/g,
      function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]

    return '<span class="badge badge-' + s.tone + '">' + esc(s.label) + '</span>'

  function verdictBadge(verdict, title) {
    var v = D.VERDICTS[verdict]
    return (
      '<span class="badge badge-' +

      '"' +
      (title ? ' title="' + esc(title) + '"' : '') +
      '><span class="dot"></span>' +

    )

  function sourceTag(text) {

  function weekKey(index) {
    return D.WEEKS[index].key
  }

  function weekIndex(key) {
    for (var i = 0; i < D.WEEKS.length; i++) {
      if (D.WEEKS[i].key === key) return i
    }
    return -1
  }

  function formatDate(iso) {
    var parts = iso.split('-')
    var months = [
      'ene', 'feb', 'mar', 'abr', 'may', 'jun',
      'jul', 'ago', 'sep', 'oct', 'nov', 'dic',
    ]
    return parseInt(parts[2], 10) + ' ' + months[parseInt(parts[1], 10) - 1] + ' ' + parts[0]
  }

  /* ----------------------------------------------------------- matriz base */

  function buildMatrix(projectIds) {
    var rows = E.capacityFor(projectIds)
    var list = projectIds.length === 1 ? E.peopleOf(projectIds[0]) : D.PEOPLE.slice()
    return list.map(function (p) {
      var row = rows[p.id] || { plan: {} }
      var cells = D.WEEKS.map(function (week, index) {
        var plan = row.plan[week.key] || 0
        var capacity = E.capacityOf(p, week.key)
        var real = D.REAL[p.id] ? D.REAL[p.id][index] : null
        return {
          week: week.key,
          label: week.label,
          index: index,
          plan: plan,
          capacity: capacity,
          real: real,
          drift: real === null ? null : real - plan,
          verdict: E.verdictFor(plan, capacity),
          ratio: E.ratioOf(plan, capacity),
          isNow: week.key === D.CURRENT_WEEK,
        }
      })
      return { person: p, cells: cells }
    })
  }

  function weekTotals(matrix) {
    return D.WEEKS.map(function (week, index) {
      var plan = 0
      var capacity = 0
      matrix.forEach(function (row) {
        plan += row.cells[index].plan
        capacity += row.cells[index].capacity
      })
      return {
        week: week.key,
        plan: plan,
        capacity: capacity,
        ratio: capacity ? Math.round((plan / capacity) * 1000) / 10 : 0,
        max: matrix.reduce(function (acc, row) {
          return Math.max(acc, row.cells[index].plan)
        }, 0),
      }
    })
  }

  /* ---------------------------------------------------------------- router */

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '')
    var parts = raw.split('/').filter(Boolean)
    if (!parts.length) return { route: 'panel', projectId: null }
    if (parts[0] === 'projects' && parts[1]) {
      return { route: parts[2] || 'summary', projectId: parts[1] }
    }
    return { route: parts[0], projectId: null }
  }

  function go(path) {
    if (location.hash === '#' + path) {
      route()
    } else {
      location.hash = path
    }
  }

  function route() {
    var parsed = parseHash()
    state.route = parsed.route
    state.projectId = parsed.projectId
    state.drawer = null
    render()
    document.querySelector('.content').scrollTop = 0
  }

  /* ------------------------------------------------------------- vistas */

  function viewPanel() {
    var matrix = buildMatrix(D.PROJECTS.map(function (p) {
      return p.id
    }))
    var totals = weekTotals(matrix)
    var now = weekIndex(D.CURRENT_WEEK)
    var nowTotals = totals[now]

    var criticalPeople = []
    matrix.forEach(function (row) {
      var hasCritical = row.cells.some(function (c) {
        return c.verdict === 'critical'
      })
      if (hasCritical) criticalPeople.push(row)
    })

    var pendingApprovals = D.APPROVALS.filter(function (a) {
      return !state.approvals[a.id]
    })
    var openIncidents = D.INCIDENTS.filter(function (i) {
      return i.status === 'open'
    })

    var html = ''

    html +=
      '<div class="toolbar">' +
      '<h2 style="margin:0;font-size:19px;font-weight:600">Panel de capacidad</h2>' +
      sourceTag('OpenProject + Leantime + Paperclip') +
      '<span class="spacer"></span>' +
      '<span class="hint">Semana en curso: <strong>' +
      esc(D.CURRENT_WEEK) +
      '</strong></span>' +
      '</div>'

    html +=
      '<div class="grid grid-4" style="margin-bottom:16px">' +
      statCard(
        'Utilización media de la semana',
        nowTotals.ratio + '<small>%</small>',
        nowTotals.plan.toFixed(1) + ' h planificadas de ' + nowTotals.capacity.toFixed(0) + ' h de capacidad',
        nowTotals.ratio >= 90 ? 'up' : '',
      ) +
      statCard(
        'Personas en veredicto crítico',
        String(criticalPeople.length),
        criticalPeople.length
          ? criticalPeople
              .map(function (r) {
                return esc(r.person.name.split(' ')[0])
              })
              .join(', ') + ' por encima del umbral duro'
          : 'Nadie por encima del umbral duro',
        criticalPeople.length ? 'up' : 'good',
      ) +
      statCard(
        'Aprobaciones pendientes',
        String(pendingApprovals.length),
        'El umbral duro no es una alerta: es una aprobación obligatoria',
        pendingApprovals.length ? 'up' : 'good',
      ) +
      statCard(
        'Incidentes de política abiertos',
        String(openIncidents.length),
        'Registro idempotente por política, ventana y umbral',
        openIncidents.length ? 'up' : 'good',
      ) +
      '</div>'

    html +=
      '<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Veredicto de capacidad por persona</h3>' +
      '<span class="sub">9 semanas · del peor al mejor</span></div>' +
      '<div class="card-body tight">' +
      personVerdictList(matrix) +
      '</div></div>'

    html +=
      '<div class="grid grid-2" style="margin-bottom:16px">' +
      incidentsCard(openIncidents, true) +
      approvalsCard(pendingApprovals, true) +
      '</div>'

    html +=
      '<div class="card"><div class="card-head"><h3>Actividad reciente</h3>' +
      '<span class="sub">Bitácora append-only</span>' +
      '<button type="button" class="btn btn-secondary btn-sm" data-nav="activity">Ver toda la bitácora</button></div>' +
      '<div class="card-body">' +
      activityTimeline(D.ACTIVITY.slice(0, 4)) +
      '</div></div>'

    return html
  }

  function statCard(label, value, foot, tone) {
    return (
      '<div class="stat"><div class="stat-label">' +
      esc(label) +
      '</div><div class="stat-value">' +
      value +
      '</div><div class="stat-foot ' +
      (tone || '') +
      '">' +
      esc(foot) +
      '</div></div>'
    )
  }

  function personVerdictList(matrix) {
    var html =
      '<table class="table"><thead><tr><th>Persona</th><th>Semanas</th><th style="width:150px">Distribución</th><th>Veredicto</th></tr></thead><tbody>'
    matrix.forEach(function (row) {
      var counts = {}
      row.cells.forEach(function (c) {
        counts[c.verdict] = (counts[c.verdict] || 0) + 1
      })
      var bar = '<div class="verdict-bar">'
      Object.keys(D.VERDICTS)
        .sort(function (a, b) {
          return D.VERDICTS[a].rank - D.VERDICTS[b].rank
        })
        .forEach(function (verdict) {
          if (!counts[verdict]) return
          bar +=
            '<span class="vb-' +
            verdict +
            '" style="width:' +
            (counts[verdict] / row.cells.length) * 100 +
            '%" title="' +
            esc(D.VERDICTS[verdict].label) +
            '"></span>'
        })
      bar += '</div>'

      var chips = '<div class="week-chips">'
      row.cells.forEach(function (c) {

  /* -------------------------------------------------- capacidad (global) */

  function viewCapacity() {

  function capacityBody(projectIds, isGlobal) {
    var matrix = buildMatrix(projectIds)
    var totals = weekTotals(matrix)
    var mode = state.matrixMode

    var toolbar =
      '<div class="toolbar">' +
      '<div class="field">' +
      icon('layers', 'ico') +
      '<select data-action="saved-view">' +
      '<option value="">Vista guardada…</option>' +
      D.SAVED_VIEWS.map(function (v) {
        return (
          '<option value="' +
          esc(v.name) +
          '"' +
          (state.savedView === v.name ? ' selected' : '') +
          '>' +
          esc(v.name) +
          ' · ' +
          esc(v.scope) +
          '</option>'
        )
      }).join('') +
      '</select></div>' +
      '<div class="seg">' +
      ['plan', 'real', 'drift']
        .map(function (m) {
          var label = m === 'plan' ? 'Planificado' : m === 'real' ? 'Real' : 'Deriva'
          return (
            '<button type="button" data-mode="' +
            m +
            '" class="' +
            (mode === m ? 'is-active' : '') +
            '">' +
            label +
            '</button>'
          )
        })
        .join('') +
      '</div>' +
      (isGlobal
        ? '<div class="field">' +
          '<select data-action="dept-filter"><option value="">Todos los departamentos</option>' +
          D.DEPARTMENTS.map(function (d) {
            return (
              '<option value="' +
              esc(d.name) +
              '"' +
              (state.deptFilter === d.name ? ' selected' : '') +
              '>' +
              esc(d.name) +
              '</option>'
            )
          }).join('') +
          '</select></div>'
        : '') +
      '<span class="spacer"></span>' +
      '<span class="hint">Umbral de aviso <strong>' +
      D.THRESHOLDS.warn +
      '%</strong> · umbral duro <strong>' +
      D.THRESHOLDS.hard +
      '%</strong></span>' +
      '<button type="button" class="btn btn-secondary btn-sm" data-action="export">' +
      icon('download') +
      'Exportar .ics</button>' +
      '</div>'

    if (state.savedView) {
      var view = D.SAVED_VIEWS.filter(function (v) {
        return v.name === state.savedView
      })[0]
      if (view) {
        toolbar +=
          '<div class="callout" style="margin-bottom:16px;display:flex;align-items:center;gap:10px">' +
          icon('layers', 'ico') +
          '<span><strong>' +
          esc(view.name) +
          '</strong> — ' +
          esc(view.filters) +
          '. Filtros guardados por ' +
          esc(view.owner) +
          ' · ' +
          (view.shared ? 'vista pública' : 'vista privada') +
          '</span></div>'
      }
    }

    var filtered = matrix
    if (state.deptFilter) {
      filtered = matrix.filter(function (row) {
        return row.person.dept === state.deptFilter
      })
    }

    var head =
      '<table class="matrix"><thead><tr><th class="corner">Persona</th>' +
      D.WEEKS.map(function (week) {
        return (
          '<th class="' +
          (week.key === D.CURRENT_WEEK ? 'now' : '') +
          '"><span class="wk">' +
          esc(week.label) +
          '</span><span class="wk-sub">' +
          esc(week.key.slice(2)) +
          '</span></th>'
        )
      }).join('') +
      '</tr></thead><tbody>'

    var body = filtered
      .map(function (row) {
        var cells = row.cells
          .map(function (c) {
            var value = mode === 'plan' ? c.plan : mode === 'real' ? c.real : c.drift
            var sub = ''
            var extra = ''
            if (mode === 'plan') {
              sub = c.ratio === null ? '—' : c.ratio + '%'
            } else if (mode === 'real') {
              sub = c.real === null ? 'sin imputar' : c.ratio === null ? '—' : c.ratio + '%'
            } else {
              if (c.drift === null) sub = 'sin imputar'
              else if (c.drift > 0) sub = 'sobre lo previsto'
              else if (c.drift < 0) sub = 'por debajo'
              else sub = 'en línea'
              if (c.drift !== null && Math.abs(c.drift) > 0.001) {
                extra = c.drift > 0 ? ' drift-up' : ' drift-down'
              }
            }
            var display =
              value === null
                ? '—'
                : mode === 'drift'
                ? (value > 0 ? '+' : '') + h(value)
                : h(value)
            return (
              '<td class="cell v-' +
              c.verdict +
              extra +
              '" data-cell="' +
              row.person.id +
              '" data-week="' +
              c.week +
              '" title="' +
              esc(c.week + ' · ' + D.VERDICTS[c.verdict].label) +
              '"><span class="h">' +
              display +
              '</span><span class="p">' +
              esc(sub) +
              '</span></td>'
            )
          })
          .join('')

        var worst = row.cells
          .slice()
          .sort(function (a, b) {
            return D.VERDICTS[a.verdict].rank - D.VERDICTS[b.verdict].rank
          })[0]

        return (
          '<tr><th class="corner"><div class="person-cell"><span class="avatar sm ' +
          (worst.verdict === 'critical' ? 'tone-danger' : '') +
          '">' +
          esc(row.person.initials) +
          '</span><span class="meta"><strong>' +
          esc(row.person.name) +
          '</strong><span>' +
          esc(row.person.role) +
          ' · ' +
          h(row.cells[0].capacity) +
          ' h/sem</span></span></div></th>' +
          cells +
          '</tr>'
        )
      })
      .join('')

    var foot =
      '<tfoot><tr><th class="corner">Total planificado</th>' +
      totals
        .map(function (t) {
          return (
            '<td><span class="h">' +
            h(t.plan) +
            '</span><span class="p">' +
            t.ratio +
            '%</span></td>'
          )
        })
        .join('') +
      '</tr><tr><th class="corner">Capacidad del equipo</th>' +
      totals
        .map(function (t) {
          return (
            '<td><span class="h">' +
            h(t.capacity) +
            '</span><span class="p">máx ' +
            h(t.max) +
            '</span></td>'
          )
        })
        .join('') +
      '</tr></tfoot></table>'

    var legend =
      '<div class="legend">' +
      '<strong style="color:#475569">Veredictos</strong>' +
      Object.keys(D.VERDICTS)
        .sort(function (a, b) {
          return D.VERDICTS[a].rank - D.VERDICTS[b].rank
        })
        .map(function (v) {
          return (
            '<span class="badge badge-' +
            v +
            '"><span class="dot"></span>' +
            esc(D.VERDICTS[v].label) +
            '</span>'
          )
        })
        .join('') +
      '<span class="spacer"></span>' +
      '<span>La celda roja deja de ser un color: pasa a ser el resultado de evaluar una política.</span>' +
      '</div>'

    return (
      toolbar +
      '<div class="matrix-wrap">' +
      head +
      body +
      foot +
      '</table></div>' +
      legend
    )
  }

    weeks.forEach(function (week) {
      html +=

    })
    html += '</tr></thead><tbody>'

      html +=

        h(row.cells[0].capacity) +

      row.cells.forEach(function (c) {

          '<td class="cell v-' +

      '<div class="card"><div class="card-head"><h3>Asignaciones por persona</h3>' +

    html +=
      '<table class="table"><thead><tr><th>Persona</th><th>Semana</th><th>Tareas</th><th class="num">Horas</th></tr></thead><tbody>'
    matrix.forEach(function (row) {
      row.cells.forEach(function (c) {
        if (!c.plan) return
        var taskList = tasksOfPersonWeek(projectIds, row.person.id, c.week)
        html +=
          '<tr><td>' +
          esc(row.person.name.split(' ')[0]) +
          '</td><td>' +
          esc(c.week) +
          '</td><td>' +
          taskList
            .map(function (t) {
              return '<span class="tag">' + esc(t.id + ' · ' + t.title) + '</span>'
            })
            .join(' ') +
          '</td><td class="num num-strong">' +
          h(c.plan) +
          ' h</td></tr>'
      })
    })
    html += '</tbody></table></div></div></div>'
    return html
  }

  function tasksOfPersonWeek(projectIds, userId, week) {
    var monday = E.weekMonday(week)
    var sunday = E.addDays(monday, 6)
    return D.TASKS.filter(function (task) {
      if (projectIds.indexOf(task.project) < 0) return false
      if (task.user !== userId) return false
      return E.dnum(task.start) <= E.dnum(sunday) && E.dnum(task.end) >= E.dnum(monday)
    })
  }

  function plannerTable(projectIds) {
    var matrix = buildMatrix(projectIds)
    var html =
      '<div class="card"><div class="card-head"><h3>Tabla de planificación</h3>' +
      '<span class="sub">Cada celda reparte las horas entre los proyectos de la persona</span>' +
      '</div><div class="card-body tight"><div class="matrix-wrap"><table class="matrix"><thead><tr><th class="corner">Persona</th>'
    D.WEEKS.forEach(function (week) {
      html += '<th><span class="wk">' + esc(week.label) + '</span></th>'
    })
    html += '</tr></thead><tbody>'

    matrix.forEach(function (row) {
      html +=
        '<tr><th class="corner"><div class="person-cell"><span class="avatar sm">' +
        esc(row.person.initials) +
        '</span><span class="meta"><strong>' +
        esc(row.person.name) +
        '</strong><span>' +
        h(row.cells[0].capacity) +

              byProject[pid] +

          (chips || '<span class="hint">—</span>') +
          '</div><div class="hint" style="margin-top:2px">' +
          h(c.plan) +
          ' h' +
          (c.ratio === null ? '' : ' · ' + c.ratio + '%') +
          '</div></td>'
      })
      html += '</tr>'
    })
    html += '</tbody></table></div></div></div>'
    return html

  function employmentLabel(value) {
    var map = {
      objetivo: 'Objetivo',
      techo: 'Techo',
      facturacion: 'Tope de facturación',
      mejor_esfuerzo: 'Mejor esfuerzo',
    }
    return map[value] || value
  }

  function scheduleChips(person) {
    var days = ['L', 'M', 'X', 'J', 'V']
    var out = '<span class="week-chips">'
    for (var i = 0; i < 5; i++) {
      var hours = person.schedule[i] || 0

        esc(hday.scope_label) +
        '</span></td>' +
        '<td>' +
        (hday.half_day
          ? '<span class="badge badge-tight">Media jornada</span>'
          : '<span class="hint">Jornada completa</span>') +
        '</td>' +
        '<td class="num num-strong">' +
        hday.impact +
        '</td></tr>'
    })
    html += '</tbody></table></div></div>'

    html += '<div class="card"><div class="card-head"><h3>Noviembre 2026</h3></div><div class="card-body">' +
      monthGrid(2026, 11) +
      '</div></div></div>'

    /* Impacto en la capacidad */
    html +=
      '<div class="card"><div class="card-head"><h3>Impacto en la capacidad semanal</h3>' +
      '<span class="sub">Capacidad real frente a la que habría sin festivos</span></div>' +
      '<div class="card-body tight"><table class="table"><thead><tr>' +
      '<th>Persona</th><th>Semana</th><th>Motivo</th><th class="num">Capacidad sin festivo</th>' +
      '<th class="num">Capacidad efectiva</th><th class="num">Diferencia</th></tr></thead><tbody>'

    var impacts = []
    D.PEOPLE.forEach(function (p) {
      D.WEEKS.forEach(function (week) {
        var base = 0
        var real = 0
        for (var i = 0; i < 5; i++) {
          var hours = p.schedule[i] || 0
          if (!hours) continue
          var day = E.addDays(week.start, i)
          base += hours * (p.factor / 100)
          real += hours * (p.factor / 100) * (1 - E.holidayWeight(day, { dept: p.dept, personName: p.name }))
        }
        var diff = Math.round((base - real) * 100) / 100
        if (diff > 0.001) {
          impacts.push({ person: p, week: week.key, base: base, real: real, diff: diff })
        }
      })
    })

    impacts.forEach(function (item) {
      var reasons = D.HOLIDAYS.filter(function (hd) {
        var monday = E.weekMonday(item.week)
        for (var i = 0; i < 7; i++) {
          var day = E.addDays(monday, i)
          if (hd.date === day) {
            if (
              hd.scope === 'global' ||
              (hd.scope === 'dept' && hd.scope_label === item.person.dept) ||
              (hd.scope === 'person' && hd.scope_label === item.person.name)
            ) {
              return true
            }
          }
        }
        return false
      })
      html +=
        '<tr><td><div class="person-cell"><span class="avatar sm">' +
        esc(item.person.initials) +
        '</span><span class="meta"><strong>' +
        esc(item.person.name) +
        '</strong></span></div></td>' +
        '<td>' +
        esc(item.week) +
        '</td>' +
        '<td class="hint">' +
        esc(
          reasons
            .map(function (r) {
              return r.name + (r.half_day ? ' (media jornada)' : '')
            })
            .join(', '),
        ) +
        '</td>' +
        '<td class="num num-strong">' +
        h(item.base) +
        ' h</td>' +
        '<td class="num num-strong">' +
        h(item.real) +
        ' h</td>' +
        '<td class="num pill-up">−' +
        h(item.diff) +
        ' h</td></tr>'
    })
    html += '</tbody></table></div></div>'

    return html
  }

  function monthGrid(year, month) {
    var first = new Date(Date.UTC(year, month - 1, 1))
    var startPad = (first.getUTCDay() + 6) % 7
    var daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate()
    var names = ['L', 'M', 'X', 'J', 'V', 'S', 'D']

    var html = '<div class="month-cal">'
    names.forEach(function (n) {
      html += '<div class="dow">' + n + '</div>'
    })
    for (var i = 0; i < startPad; i++) html += '<div class="day blank"></div>'
    for (var day = 1; day <= daysInMonth; day++) {
      var iso = year + '-' + (month < 10 ? '0' + month : month) + '-' + (day < 10 ? '0' + day : day)
      var holidays = D.HOLIDAYS.filter(function (hd) {
        return hd.date === iso
      })
      var isToday = iso === '2026-11-17'
      html +=
        '<div class="day' +
        (isToday ? ' today' : '') +
        '"><span>' +
        day +
        '</span>'
      holidays.forEach(function (hd) {
        var cls = hd.scope === 'global' ? 'global' : hd.scope === 'dept' ? 'dept' : 'person'
        html +=
          '<span class="marker ' +
          cls +
          '" title="' +
          esc(hd.name + ' · ' + hd.scope_label + (hd.half_day ? ' · media jornada' : '')) +
          '">' +
          esc(hd.name) +
          '</span>'
      })
      html += '</div>'
    }
    html += '</div>'
    html +=
      '<div class="row wrap" style="margin-top:12px;gap:14px;font-size:12px;color:#64748b">' +
      '<span><span class="swatch" style="background:#004a89"></span>Global</span>' +
      '<span><span class="swatch" style="background:#f59e0b"></span>Departamento</span>' +
      '<span><span class="swatch" style="background:#7c3aed"></span>Persona</span>' +
      '</div>'
    return html
  }

  function viewProjectSummary() {
    var p = project(state.projectId)
    var matrix = buildMatrix([p.id])
    var totals = weekTotals(matrix)
    var now = totals[weekIndex(D.CURRENT_WEEK)]

    var tasks = E.tasksOf(p.id)
    var open = tasks.filter(function (t) {
      return t.status !== 'done'
    })
    var critical = []
    matrix.forEach(function (row) {
      row.cells.forEach(function (c) {
        if (c.verdict === 'critical') critical.push({ person: row.person, cell: c })
      })
    })
    var projectIncidents = D.INCIDENTS.filter(function (i) {

  var MONTH_NAMES = [
    'ene', 'feb', 'mar', 'abr', 'may', 'jun',
    'jul', 'ago', 'sep', 'oct', 'nov', 'dic',
  ]

  /** Cabecera del Gantt: bandas de mes y marcas de semana sobre el rango. */
  function ganttHead(min, max, totalDays) {
    function pos(date) {
      return ((E.dnum(date) - E.dnum(min)) / (totalDays * 86400000)) * 100
    }
    function size(from, to) {
      return ((E.dnum(to) - E.dnum(from)) / (totalDays * 86400000)) * 100
    }

    var html = ''
    var cursor = min
    var guard = 0
    while (E.dnum(cursor) <= E.dnum(max) && guard++ < 24) {
      var date = new Date(E.dnum(cursor))
      var year = date.getUTCFullYear()
      var month = date.getUTCMonth()
      var lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate()
      var monthEnd = year + '-' + E.pad(month + 1) + '-' + E.pad(lastDay)
      var clipped = E.dnum(monthEnd) > E.dnum(max) ? max : monthEnd
      html +=
        '<div class="month" style="left:' +
        pos(cursor) +
        '%;width:' +
        size(cursor, clipped) +
        '%">' +
        MONTH_NAMES[month] +
        ' ' +
        year +
        '</div>'
      if (month === 11) cursor = year + 1 + '-01-01'
      else cursor = year + '-' + E.pad(month + 2) + '-01'
    }

    var monday = E.weekMonday(E.isoWeekKey(min))
    guard = 0
    while (E.dnum(monday) <= E.dnum(max) && guard++ < 40) {
      var weekKey = E.isoWeekKey(monday)
      var weekEnd = E.addDays(monday, 6)
      var clippedEnd = E.dnum(weekEnd) > E.dnum(max) ? max : weekEnd
      var isNow = weekKey === D.CURRENT_WEEK
      html +=
        '<div class="week" style="left:' +
        pos(monday) +
        '%;width:' +
        size(monday, clippedEnd) +
        '%;' +
        (isNow ? 'background:#eef4fa;color:#004a89;font-weight:600;' : '') +
        '">' +
        weekKey.slice(-2) +
        '</div>'
      monday = E.addDays(monday, 7)
    }
    return html
  }

  function viewGantt() {
    var p = project(state.projectId)
    var tasks = E.tasksOf(p.id)
    var deps = E.dependenciesOf(p.id)

    var min = null
    var max = null
    tasks.forEach(function (t) {
      if (!min || E.dnum(t.start) < E.dnum(min)) min = t.start
      if (!max || E.dnum(t.end) > E.dnum(max)) max = t.end
    })
    if (!min) return '<div class="empty">Este proyecto no tiene tareas</div>'
    min = E.addDays(min, -7)
    max = E.addDays(max, 14)
    var totalDays = Math.round((E.dnum(max) - E.dnum(min)) / 86400000)

    var html =
      '<div class="toolbar"><h2 style="margin:0;font-size:19px;font-weight:600">Cronograma</h2>' +
      sourceTag('ERPNext · OpenProject · dependencias') +

    html +=
      '<div class="gantt"><div class="gantt-inner" id="gantt-inner">' +
      '<div class="gantt-head-row"><div class="gantt-head-label">Tarea</div>' +

      ganttHead(min, max, totalDays) +
      '</div></div>' +
      '<svg class="gantt-deps" id="gantt-deps"></svg>'

    tasks.forEach(function (t) {
      var left = ((E.dnum(t.start) - E.dnum(min)) / (totalDays * 86400000)) * 100
      var width = ((E.dnum(t.end) - E.dnum(t.start)) / (totalDays * 86400000)) * 100 + 100 / totalDays
      var critical = D.CRITICAL_PATH.indexOf(t.id) >= 0
      var owner = person(t.user)

      html +=

        (critical ? ' critical' : '') +
        '" data-bar="' +
        t.id +
        '" style="left:' +
        left +
        '%;width:' +
        width +
        '%;background:' +
        color +
        '">' +
        esc(t.id + ' · ' + t.hours + ' h') +
        '</div></div></div>'
    })

    html += '</div></div>'

    html +=
      '<div class="gantt-legend">' +
      '<span><span class="swatch" style="background:#dc2626"></span>Ruta crítica</span>' +
      '<span>' +
      icon('link', 'ico') +

      '</div>'

  function ownerColor(id) {
    var map = {
      u1: '#003466',
      u2: '#0064b4',
      u3: '#0891b2',
      u4: '#7c3aed',
      u5: '#b45309',
      u6: '#059669',
      u7: '#2563eb',
      u8: '#db2777',
      u9: '#94a3b8',
    }
    return map[id] || '#64748b'
  }

  function drawDependencies() {
    var svg = document.getElementById('gantt-deps')
    var inner = document.getElementById('gantt-inner')
    if (!svg || !inner) return

    var base = inner.getBoundingClientRect()
    var width = inner.offsetWidth
    var height = inner.offsetHeight
    svg.setAttribute('width', width)
    svg.setAttribute('height', height)
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height)
    svg.innerHTML = ''

    var markers = ['#dc2626', '#94a3b8']
      .map(function (color) {
        return (
          '<defs><marker id="arrow-' +
          color.slice(1) +
          '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
          '<path d="M 0 0 L 10 5 L 0 10 z" fill="' +
          color +
          '"/></marker></defs>'
        )
      })
      .join('')
    svg.insertAdjacentHTML('afterbegin', markers)

    E.dependenciesOf(state.projectId).forEach(function (dep) {
      var from = inner.querySelector('[data-bar="' + dep.from + '"]')
      var to = inner.querySelector('[data-bar="' + dep.to + '"]')
      if (!from || !to) return
      var a = from.getBoundingClientRect()
      var b = to.getBoundingClientRect()
      var x1 = a.right - base.left
      var y1 = a.top + a.height / 2 - base.top
      var x2 = b.left - base.left
      var y2 = b.top + b.height / 2 - base.top
      if (x2 < x1 + 16) x2 = x1 + 16
      var mid = x1 + Math.max(14, (x2 - x1) / 2)
      var isCritical =
        D.CRITICAL_PATH.indexOf(dep.from) >= 0 && D.CRITICAL_PATH.indexOf(dep.to) >= 0
      var stroke = isCritical ? '#dc2626' : '#94a3b8'
      var path =
        '<path d="M ' +
        x1 +
        ' ' +
        y1 +
        ' L ' +
        mid +
        ' ' +
        y1 +
        ' L ' +
        mid +
        ' ' +
        y2 +
        ' L ' +
        (x2 - 5) +
        ' ' +
        y2 +
        '" fill="none" stroke="' +
        stroke +
        '" stroke-width="1.5" marker-end="url(#arrow-' +
        stroke.slice(1) +
        ')"/>'
      svg.insertAdjacentHTML('beforeend', path)
    })
  }

      personName: person_.name,
    }).length
  }

    return html
  }

  /* ------------------------------------------------------ imputación horas */

  function viewTime() {
    var p = project(state.projectId)
    var matrix = buildMatrix([p.id])
    var now = weekIndex(D.CURRENT_WEEK)

    var html =
      '<div class="toolbar"><h2 style="margin:0;font-size:19px;font-weight:600">Imputación de horas</h2>' +
      sourceTag('ERPNext · Leantime · OpenProject') +
      '<span class="spacer"></span>' +
      '<span class="hint">Lo planificado y lo real se comparan en la ventana semanal</span></div>'

    html +=
      '<div class="callout" style="margin-bottom:16px">La capacidad y el plan son tasas semanales, ' +
      'así que el real comparable es el de la semana en curso. <strong>Imputar es opcional</strong>: ' +
      'quien no imputa no se penaliza, simplemente no hay deriva que leer.</div>'

    html +=
      '<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Planificado contra real</h3>' +
      '<span class="sub">Cada celda: <strong>real / planificado</strong> · Semana en curso: ' +
      esc(D.CURRENT_WEEK) +
      '</span></div><div class="card-body tight">' +
      '<table class="table"><thead><tr><th>Persona</th>' +
      D.WEEKS.map(function (w) {
        return '<th class="num">' + esc(w.label) + '</th>'
      }).join('') +
      '</tr></thead><tbody>'

    matrix.forEach(function (row) {
      html +=
        '<tr><td><div class="person-cell"><span class="avatar sm">' +
        esc(row.person.initials) +
        '</span><span class="meta"><strong>' +
        esc(row.person.name) +
        '</strong></span></div></td>'
      row.cells.forEach(function (c) {
        if (c.real === null) {
          html += '<td class="num hint">—</td>'
          return
        }
        var cls = c.drift > 0.001 ? 'pill-up' : c.drift < -0.001 ? 'pill-down' : 'pill-flat'
        html +=
          '<td class="num"><strong>' +
          h(c.real) +
          '</strong> <span class="hint">/ ' +
          h(c.plan) +
          '</span><br><span class="' +
          cls +
          '">' +
          (c.drift > 0 ? '+' : '') +
          h(c.drift) +
          ' h</span></td>'
      })
      html += '</tr>'
    })
    html += '</tbody></table></div></div>'

    var entries = D.TIME_ENTRIES.filter(function (e) {
      return !p || true
    })

    html +=
      '<div class="card"><div class="card-head"><h3>Últimas imputaciones</h3>' +
      '<span class="sub">Tabla de horas reales, separada de la planificación</span></div>' +
      '<div class="card-body tight"><table class="table"><thead><tr>' +
      '<th>Fecha</th><th>Persona</th><th>Tarea</th><th class="num">Horas</th><th>Concepto</th></tr></thead><tbody>'
    entries.forEach(function (entry) {
      var task = E.taskById(entry.task)
      html +=
        '<tr><td>' +
        formatDate(entry.date) +
        '</td>' +
        '<td>' +
        esc(personName(entry.user)) +
        '</td>' +
        '<td>' +
        (task ? esc(task.id + ' · ' + task.title) : esc(entry.task)) +
        '</td>' +
        '<td class="num num-strong">' +
        entry.hours +
        '</td>' +
        '<td class="hint">' +
        esc(entry.note) +
        '</td></tr>'
    })
    html += '</tbody></table></div></div>'

    return html
  }

  /* -------------------------------------------------------------- drawer */

  function renderDrawer() {
    if (!els.drawer) {
      els.drawer = document.createElement('div')
      document.body.appendChild(els.drawer)
    }
    if (!state.drawer) {
      els.drawer.innerHTML = ''
      return
    }
    var html = '<div class="drawer-backdrop" data-action="close-drawer"></div>'
    if (state.drawer.type === 'cell') html += cellDrawer(state.drawer.userId, state.drawer.week)
    else if (state.drawer.type === 'task') html += taskDrawer(state.drawer.taskId)
    else if (state.drawer.type === 'person') html += personDrawer(state.drawer.userId)
    else if (state.drawer.type === 'newtask') html += newTaskDrawer()
    els.drawer.innerHTML = html
  }

  function cellDrawer(userId, week) {
    var p = person(userId)
    var index = weekIndex(week)
    var projectIds = state.projectId ? [state.projectId] : D.PROJECTS.map(function (x) {
      return x.id
    })
    var matrix = buildMatrix(projectIds)
    var row = matrix.filter(function (r) {
      return r.person.id === userId
    })[0]
    var cell = row ? row.cells[index] : null
    if (!cell) return '<div class="drawer"></div>'

    var tasks = tasksOfPersonWeek(projectIds, userId, week)
    var verdict = D.VERDICTS[cell.verdict]
    var overtime = Math.max(0, cell.plan - cell.capacity)

    var html =
      '<div class="drawer"><div class="drawer-head"><div><h2>' +
      esc(p.name) +
      '</h2><p>' +
      esc(week) +
      ' · ' +
      esc(p.role) +
      ' · ' +
      esc(p.dept) +
      '</p></div>' +
      '<button type="button" class="icon-btn" data-action="close-drawer" style="color:#64748b">' +
      icon('close') +
      '</button></div><div class="drawer-body">'

    html +=
      '<div class="row" style="margin-bottom:16px">' +
      verdictBadge(cell.verdict) +
      '<span class="hint">' +
      esc(verdict.desc) +
      '</span></div>'

    html +=
      '<dl class="kv"><dt>Planificado</dt><dd class="num-strong">' +
      h(cell.plan) +
      ' h</dd>' +
      '<dt>Capacidad efectiva</dt><dd class="num-strong">' +
      h(cell.capacity) +
      ' h</dd>' +
      '<dt>Utilización</dt><dd class="num-strong">' +
      (cell.ratio === null ? '—' : cell.ratio + ' %') +
      '</dd>' +
      '<dt>Horas reales</dt><dd class="num-strong">' +
      (cell.real === null ? 'sin imputar' : h(cell.real) + ' h') +
      '</dd>' +
      '<dt>Deriva</dt><dd class="' +
      (cell.drift > 0 ? 'pill-up' : cell.drift < 0 ? 'pill-down' : 'pill-flat') +
      '">' +
      (cell.drift === null ? '—' : (cell.drift > 0 ? '+' : '') + h(cell.drift) + ' h') +
      '</dd>' +
      '<dt>Horas extra</dt><dd>' +
      (overtime > 0
        ? '<span class="pill-up">' + h(overtime) + ' h por encima de la capacidad</span>'
        : '<span class="hint">Ninguna</span>') +
      '</dd>' +
      '<dt>Capacidad de referencia</dt><dd>' +
      h(E.weeklyCapacity(p, week)) +
      ' h (horario vigente × factor ' +
      p.factor +
      ' %)</dd></dl>'

    html += '<div class="divider"></div>'

    html += '<h3 style="font-size:14px;margin-bottom:8px">Tareas de la semana</h3>'
    if (!tasks.length) {
      html += '<div class="hint">Sin tareas asignadas en esta semana.</div>'
    } else {
      html += '<table class="table"><tbody>'
      tasks.forEach(function (t) {
        var parts = E.distribute(t, p).filter(function (x) {
          return x.week === week
        })
        var assigned = parts.reduce(function (acc, x) {
          return acc + x.hours
        }, 0)
        html +=
          '<tr><td><button type="button" class="btn btn-ghost btn-sm" data-task="' +
          t.id +
          '" style="font-weight:500;text-align:left">' +
          esc(t.title) +
          '</button><div class="hint">' +
          esc(t.id + ' · ' + projectCode(t.project)) +
          '</div></td>' +
          '<td class="num num-strong" style="width:1%">' +
          h(assigned) +
          ' h</td></tr>'
      })
      html += '</tbody></table>'
    }

    html +=
      '<div class="divider"></div>' +
      '<div class="src-note">Veredicto calculado por el motor contra el horario vigente de la persona, ' +
      'el calendario laboral y los umbrales de la política.</div>'

    html +=
      '</div><div class="drawer-foot">' +
      '<button type="button" class="btn btn-secondary" data-person="' +
      userId +
      '">Ver perfil de la persona</button>' +
      '<button type="button" class="btn btn-primary" data-action="close-drawer">Cerrar</button>' +
      '</div></div>'
    return html
  }

  function taskDrawer(taskId) {
    var t = E.taskById(taskId)
    if (!t) return '<div class="drawer"></div>'
    var owner = person(t.user)
    var deps = D.DEPENDENCIES.filter(function (d) {
      return d.to === t.id || d.from === t.id
    })
    var days = countWorkingDays(t)
    var critical = D.CRITICAL_PATH.indexOf(t.id) >= 0

    var html =
      '<div class="drawer"><div class="drawer-head"><div><h2>' +
      esc(t.title) +
      '</h2><p>' +
      esc(t.id + ' · ' + projectCode(t.project) + ' · ' + statusLabel(t.status)) +
      '</p></div>' +
      '<button type="button" class="icon-btn" data-action="close-drawer" style="color:#64748b">' +
      icon('close') +
      '</button></div><div class="drawer-body">'

    html +=
      '<dl class="kv"><dt>Persona</dt><dd>' +
      (owner ? esc(owner.name) + ' · ' + esc(owner.dept) : 'Sin asignar') +
      '</dd>' +
      '<dt>Fechas</dt><dd>' +
      formatDate(t.start) +
      ' → ' +
      formatDate(t.end) +
      '</dd>' +
      '<dt>Horas estimadas</dt><dd class="num-strong">' +
      t.hours +
      ' h</dd>' +
      '<dt>Reparto</dt><dd>' +
      days +
      ' días laborables · ' +
      (t.hours / days).toFixed(1) +
      ' h/día</dd>' +
      '<dt>Avance</dt><dd>' +
      t.progress +
      ' %</dd>' +
      '<dt>Ruta crítica</dt><dd>' +
      (critical ? '<span class="badge badge-critical">Sí</span>' : '<span class="hint">No</span>') +
      '</dd></dl>'

    if (deps.length) {
      html += '<div class="divider"></div><h3 style="font-size:14px;margin-bottom:8px">Dependencias</h3>'
      deps.forEach(function (dep) {
        var other = E.taskById(dep.from === t.id ? dep.to : dep.from)
        var arrow = dep.from === t.id ? 'depende de' : 'bloquea a'
        html +=
          '<div class="row" style="margin-bottom:6px"><span class="tag">' +
          esc(arrow) +
          '</span><span>' +
          esc(other ? other.id + ' · ' + other.title : '') +
          '</span></div>'
      })
      html += '</div>'
    }

    html +=
      '</div><div class="drawer-foot">' +
      '<button type="button" class="btn btn-secondary" data-action="close-drawer">Cerrar</button>' +
      '<button type="button" class="btn btn-primary" data-action="export">Exportar .ics</button>' +
      '</div></div>'
    return html
  }

  function personDrawer(userId) {
    var p = person(userId)
    var history = D.SCHEDULE_HISTORY[userId] || []
    var matrix = buildMatrix(
      D.PROJECTS.map(function (x) {
        return x.id
      }),
    )
    var row = matrix.filter(function (r) {
      return r.person.id === userId
    })[0]
    var cell = row ? row.cells[weekIndex(D.CURRENT_WEEK)] : null

    var html =
      '<div class="drawer"><div class="drawer-head"><div><h2>' +
      esc(p.name) +
      '</h2><p>' +
      esc(p.role + ' · ' + p.dept + ' · ' + p.level) +
      '</p></div>' +
      '<button type="button" class="icon-btn" data-action="close-drawer" style="color:#64748b">' +
      icon('close') +
      '</button></div><div class="drawer-body">'

    html +=
      '<div class="row" style="margin-bottom:16px">' +
      (cell ? verdictBadge(cell.verdict) : '') +
      '<span class="hint">Semana en curso: ' +
      (cell ? h(cell.plan) + ' h de ' + h(cell.capacity) + ' h' : '—') +
      '</span></div>'

    html +=
      '<dl class="kv"><dt>Correo</dt><dd>' +
      esc(p.email) +
      '</dd>' +
      '<dt>Tipo de contrato</dt><dd>' +
      esc(employmentLabel(p.employment)) +
      '</dd>' +
      '<dt>Horario vigente</dt><dd>' +
      scheduleChips(p) +
      '</dd>' +
      '<dt>Factor de disponibilidad</dt><dd class="num-strong">' +
      p.factor +
      ' %</dd>' +
      '<dt>Capacidad semanal</dt><dd class="num-strong">' +
      h(cell ? cell.capacity : 0) +
      ' h</dd></dl>'

    html += '<div class="divider"></div><h3 style="font-size:14px;margin-bottom:8px">Historial de horarios</h3>'
    if (!history.length) {
      html +=
        '<div class="callout warn">No hay horario vigente. Su capacidad se desconoce, ' +
        'así que no se marca como sobrecargada: el motor no inventa un límite que nadie ha definido.</div>'
    } else {
      html += '<table class="table"><tbody>'
      history.forEach(function (entry) {
        html +=
          '<tr><td class="num-strong">' +
          esc(entry.valid_from) +
          '</td><td>' +
          dayChips(entry.schedule) +
          '</td><td class="num num-strong">' +
          entry.factor +
          ' %</td><td class="hint">' +
          esc(entry.note) +
          '</td></tr>'
      })
      html += '</tbody></table>'
    }

    html +=
      '<div class="divider"></div><h3 style="font-size:14px;margin-bottom:8px">Habilidades</h3>' +
      '<div class="chip-list">' +
      Object.keys(p.skills || {})
        .map(function (s) {
          return '<span class="tag">' + esc(s) + ' · ' + p.skills[s] + '/3</span>'
        })
        .join('') +
      '</div>'

    html +=
      '</div><div class="drawer-foot">' +
      '<button type="button" class="btn btn-secondary" data-action="close-drawer">Cerrar</button>' +
      '</div></div>'
    return html
  }

  function newTaskDrawer() {
    var members = state.projectId ? E.peopleOf(state.projectId) : D.PEOPLE
    var html =
      '<div class="drawer"><div class="drawer-head"><div><h2>Nueva tarea</h2>' +
      '<p>' +
      esc(projectCode(state.projectId)) +
      ' · el alta abre la tarea en el proyecto abierto</p></div>' +
      '<button type="button" class="icon-btn" data-action="close-drawer" style="color:#64748b">' +
      icon('close') +
      '</button></div><div class="drawer-body">' +
      '<div class="callout" style="margin-bottom:16px">Demo visual: el formulario no envía nada. ' +
      'Lo que sí se ve es el contrato de la pantalla.</div>' +
      '<div class="stack">' +
      '<div class="field" style="width:100%"><input style="width:100%" placeholder="Título de la tarea"></div>' +
      '<div class="field" style="width:100%"><select style="width:100%">' +
      members
        .map(function (m) {
          return '<option>' + esc(m.name) + '</option>'
        })
        .join('') +
      '</select></div>' +
      '<div class="row"><div class="field">Inicio <input type="date" value="2026-11-16"></div>' +
      '<div class="field">Fin <input type="date" value="2026-11-27"></div></div>' +
      '<div class="field" style="width:100%"><input style="width:100%" placeholder="Horas estimadas"></div>' +
      '</div></div>' +
      '<div class="drawer-foot"><button type="button" class="btn btn-secondary" data-action="close-drawer">Cancelar</button>' +
      '<button type="button" class="btn btn-primary" data-action="create-task">Crear tarea</button></div></div>'
    return html
  }

  /* --------------------------------------------------------------- toast */

  function renderToast() {
    var existing = document.getElementById('demo-toast')
    if (existing) existing.remove()
    if (!state.toast) return
    var el = document.createElement('div')
    el.id = 'demo-toast'
    el.className = 'toast'
    el.innerHTML = icon('checkCircle') + '<span>' + esc(state.toast) + '</span>'
    document.body.appendChild(el)
    window.setTimeout(function () {
      if (state.toast) {
        state.toast = null
        renderToast()
      }
    }, 3200)
  }

  function toast(message) {
    state.toast = message
    renderToast()
  }

  /* ------------------------------------------------------------- eventos */

  document.addEventListener('click', function (event) {
    var target = event.target.closest('[data-nav],[data-action],[data-mode],[data-cell],[data-task],[data-person],[data-planner-tab],[data-activity-filter],[data-open-project]')
    if (!target) return

    if (target.hasAttribute('data-nav')) {
      var nav = target.getAttribute('data-nav')
      if (nav === 'global') go('/panel')
      else if (state.projectId) go('/projects/' + state.projectId + '/' + nav)
      else go('/' + nav)
      return
    }

    if (target.hasAttribute('data-open-project')) {
      var parts = target.getAttribute('data-open-project').split('/')
      go('/projects/' + parts[0] + '/' + (parts[1] || 'summary'))
      return
    }

    if (target.hasAttribute('data-planner-tab')) {
      state.plannerTab = target.getAttribute('data-planner-tab')
      renderContent()
      return
    }

    if (target.hasAttribute('data-activity-filter')) {
      state.activityFilter = target.getAttribute('data-activity-filter')
      renderContent()
      return
    }

    if (target.hasAttribute('data-mode')) {
      state.matrixMode = target.getAttribute('data-mode')
      renderContent()
      return
    }

    if (target.hasAttribute('data-cell')) {
      state.drawer = {
        type: 'cell',
        userId: target.getAttribute('data-cell'),
        week: target.getAttribute('data-week'),
      }
      renderDrawer()
      return
    }

    if (target.hasAttribute('data-task')) {
      state.drawer = { type: 'task', taskId: target.getAttribute('data-task') }
      renderDrawer()
      return
    }

    if (target.hasAttribute('data-person')) {
      state.drawer = { type: 'person', userId: target.getAttribute('data-person') }
      renderDrawer()
      return
    }

    var action = target.getAttribute('data-action')
    if (!action) return

    if (action === 'toggle-sidebar') {
      state.collapsed = !state.collapsed
      renderSidebar()
      return
    }
    if (action === 'close-drawer') {
      state.drawer = null
      renderDrawer()
      return
    }
    if (action === 'approve' || action === 'reject') {
      var id = target.getAttribute('data-id')
      state.approvals[id] = action === 'approve' ? 'approved' : 'rejected'
      var approval = D.APPROVALS.filter(function (a) {
        return a.id === id
      })[0]
      toast(
        action === 'approve'
          ? 'Aprobación concedida. El incidente duro se cierra y el ámbito queda liberado.'
          : 'Aprobación rechazada. La asignación que la rebasaba queda bloqueada.',
      )
      renderContent()
      renderTopbar()
      return
    }
    if (action === 'new-task') {
      state.drawer = { type: 'newtask' }
      renderDrawer()
      return
    }
    if (action === 'create-task') {
      state.drawer = null
      renderDrawer()
      toast('Tarea creada. En la demo no hay backend que la guarde.')
      return
    }
    if (action === 'recalc') {
      toast('Recálculo encolado: 12 asignaciones de 3 personas, por persona y rango.')
      return
    }
    if (action === 'export') {
      toast('Exportación .ics encolada. El DTEND es exclusivo: cada evento emite el día siguiente.')
      return
    }
  })

  document.addEventListener('change', function (event) {
    var target = event.target
    if (target.hasAttribute && target.hasAttribute('data-action')) {
      var action = target.getAttribute('data-action')
      if (action === 'pick-project') {
        var value = target.value
        if (!value) {
          go('/' + (state.projectId ? 'panel' : 'panel'))
        } else {
          var view = state.projectId ? state.route : 'summary'
          if (!state.projectId && GLOBAL_VIEWS[view] === undefined) view = 'summary'
          go('/projects/' + value + '/' + view)
        }
      }
      if (action === 'saved-view') {
        state.savedView = target.value
        renderContent()
      }
      if (action === 'dept-filter') {
        state.deptFilter = target.value
        renderContent()
      }
    }
  })

  /* ---------------------------------------------------------------- init */

  function init() {
    els.sidebar = document.getElementById('sidebar')
    els.topbar = document.getElementById('topbar')
    els.content = document.getElementById('view')

    window.addEventListener('hashchange', route)
    route()
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init)
  } else {
    init()
  }
})()

</script>
  </body>
</html>
