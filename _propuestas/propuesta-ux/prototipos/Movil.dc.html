<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi trabajo en móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0f172a}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f8fafc;display:flex;flex-direction:column;overflow:hidden">

<header style="flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0">
<button type="button" aria-label="Abrir el menú" onClick="{{toggle}}" aria-expanded="{{expanded}}" style="width:44px;height:44px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"></path></svg>
</button>
<span style="flex:1;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600">Mi trabajo</span>
<button type="button" aria-label="Nueva tarea" style="width:44px;height:44px;border:0;border-radius:10px;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
</button>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<nav aria-label="Principal" data-dark="true" style="flex:0 0 auto;background:#0f172a;color:#cbd5e1;padding:12px;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{menu}}" as="it" hint-placeholder-count="8">
<a href="#" aria-current="{{it.cur}}" style="min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:8px;font-size:14px;{{it.dyn}}">{{it.label}}</a>
</sc-for>
</nav>
</sc-if>

<main style="flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px">

<div style="display:flex;gap:10px;align-items:flex-start;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:1px"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z M12 9v4 M12 17h.01"></path></svg>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:13px;font-weight:600;color:#7f1d1d">Semana 46 sobrecargada</span>
<span style="font-size:12px;color:#7f1d1d">48 h para 40 h de capacidad.</span>
</div>
</div>

<section aria-label="Esta semana" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;color:#475569">Semana 45 · 2–8 nov</span>
<span style="display:flex;align-items:baseline;gap:6px"><span style="font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:600;font-variant-numeric:tabular-nums">36 h</span><span style="font-size:14px;color:#475569">de 40 h</span></span>
<span style="display:block;width:100%;height:8px;border-radius:4px;background:#e2e8f0"><span style="display:block;width:90%;height:8px;border-radius:4px;background:#15803d"></span></span>
<span style="align-self:flex-start;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#bbf7d0;color:#14532d">Óptimo · 90 %</span>
</section>

<section aria-label="Próximas semanas" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600">Próximas semanas</h2>
<div role="list" style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{weeks}}" as="w" hint-placeholder-count="4">
<div role="listitem" style="display:flex;align-items:center;gap:10px">
<span style="flex:0 0 54px;font-size:12px;color:#475569">Sem {{w.n}}</span>
<span style="flex:1;display:block;height:10px;border-radius:5px;background:#e2e8f0"><span style="display:block;height:10px;border-radius:5px;{{w.bar}}"></span></span>
<span style="flex:0 0 70px;display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums">
<sc-if value="{{w.over}}" hint-placeholder-val="{{false}}">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7f1d1d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z M12 9v4 M12 17h.01"></path></svg>
</sc-if>
{{w.txt}}</span>
</div>
</sc-for>
</div>
</section>

<section aria-label="Mis tareas" style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:4px 0 0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600">Tareas de esta semana</h2>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;gap:8px">
<span style="font-size:14px;font-weight:600">{{t.title}}</span>
<span style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">{{t.hours}} h</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#475569">
<span style="border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;background:#ccfbf1;color:#115e59">{{t.code}}</span>
<span>{{t.dates}}</span>
<span style="border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;{{t.stat}}">{{t.status}}</span>
</div>
<select aria-label="Cambiar el estado de {{t.title}}" style="height:44px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:0 10px;font-size:14px">
<option>Cambiar estado…</option>
<option>Backlog</option>
<option>En desarrollo</option>
<option>Pruebas (FAT/SAT)</option>
<option>Completado</option>
</select>
</div>
</sc-for>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const MENU = ['Panel', 'Mi trabajo', 'Capacidad', 'Gantt', 'Calendario', 'Proyectos', 'Personas', 'Departamentos'];
const WEEKS = [[46, 48, 40], [47, 44, 40], [48, 28, 40], [49, 12, 40]];
const TASKS = [
  ['Programación PLC pasteurizador', 'SIVE', '2–6 nov', 16, 'En desarrollo', 'background:#dbeafe;color:#1e3a8a;'],
  ['Pantallas HMI de proceso', 'SIVE', '3–5 nov', 12, 'En desarrollo', 'background:#dbeafe;color:#1e3a8a;'],
  ['Pruebas FAT', 'RET', '5–6 nov', 8, 'Pruebas', 'background:#fef3c7;color:#78350f;']
];
function tone(h, cap) {
  const p = h / cap;
  if (p > 1.1) return '#b91c1c';
  if (p > 1) return '#b45309';
  if (p >= 0.85) return '#15803d';
  if (p >= 0.5) return '#475569';
  return '#1d4ed8';
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
  }
  renderVals() {
    const self = this;
    const menu = MENU.map(function (l) {
      const on = l === 'Mi trabajo';
      return { label: l, cur: on ? 'page' : 'false', dyn: on ? 'background:#1e293b;color:#fff;font-weight:600;' : 'color:#cbd5e1;font-weight:500;' };
    });
    const weeks = WEEKS.map(function (w) {
      return {
        n: w[0], txt: w[1] + ' h', over: w[1] > w[2],
        bar: 'width:' + Math.min(100, Math.round(w[1] / w[2] * 100)) + '%;background:' + tone(w[1], w[2]) + ';'
      };
    });
    const tasks = TASKS.map(function (t) {
      return { title: t[0], code: t[1], dates: t[2], hours: t[3], status: t[4], stat: t[5] };
    });
    return {
      menu: menu, weeks: weeks, tasks: tasks,
      open: this.state.open,
      expanded: this.state.open ? 'true' : 'false',
      toggle: function () { self.setState({ open: !self.state.open }); }
    };
  }
}
</script>
</body>
</html>
